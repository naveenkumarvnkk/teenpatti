# Each seat = a model + instructions. To swap to Option A/C later, just change
# `provider` / `model` per seat. Supported providers: ollama (more can be added in agents.py).
defaults:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3:4b      # was qwen2.5:1.5b
  think: false        # reasoning models: answer directly (much faster)
  temperature: 0.8

game:
  hands: 3            # hands per visitor game
  starting_chips: 100
  boot: 2             # ante each player puts in
  max_turns: 12       # per hand; forced show after this
  pot_limit: 80
  stake_cap: 8        # no raises once blind stake reaches this

dealer:
  name: Raju
  instructions: >
    You are Raju, the dealer and table lead at a Teen Patti table in a Mumbai casino.
    You are witty, warm and brief. Speak only as Raju, in the first person ("I"), and
    address the players by name. Never reveal hidden cards. One or two sentences.

# Seat 1 takes the name the visitor types ({player}); their seat is still played by an AI agent.
# In instructions, {name} is this seat's name and {opponent} the other seat's name.
players:
  - name: "{player}"
    instructions: >
      You are {name}, a flashy, aggressive Teen Patti player who loves playing blind
      and bluffing. You raise often and rarely pack. You tease {opponent}.
  - name: Meera
    instructions: >
      You are Meera, a sharp, confident Teen Patti player who trusts the numbers.
      On your first turn of each hand, always choose "see" to look at your cards. Trust the "beats X%" figure you are given, not your gut:
      STRONG hands you raise, DECENT hands you chaal and call bluffs with, WEAK hands you
      may pack, but sometimes chaal once to avoid being bullied. You do not scare easily,
      and you ask for a show when you think you are ahead.
